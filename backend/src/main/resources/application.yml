server:
  port: 8080

spring:
  application:
    name: roadpilot-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/roadpilot
    username: roadpilot
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    # 256-bit secret key base64 encoded for JWT signing (HMAC-SHA256)
    # This is a development key: base64("roadpilot-ai-secure-jwt-secret-key-signature-256-bit")
    secret: cm9hZHBpbG90LWFpLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS1zaWduYXR1cmUtMjU2LWJpdA==
    expiration-ms: 3600000 # 1 hour
    refresh-expiration-ms: 86400000 # 24 hours
